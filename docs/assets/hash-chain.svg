<text x="36.0" y="44.0" font-size="22" fill="#1f2328" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, sans-serif" font-weight="600" text-anchor="start" xml:space="preserve">ハッシュチェーンによる改ざん検知</text>
<text x="404.0" y="44.0" font-size="14" fill="#59636e" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, sans-serif" text-anchor="start" xml:space="preserve">— 1 件の変更でも、以降のハッシュがすべて食い違う</text>
<text x="36.0" y="96.0" font-size="15" fill="#1a7f37" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, sans-serif" font-weight="600" text-anchor="start" xml:space="preserve">正常な状態</text>
<text x="52.0" y="142.0" font-size="15" fill="#1a7f37" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, sans-serif" font-weight="600" text-anchor="start" xml:space="preserve">第 1 項</text>
<text x="52.0" y="166.0" font-size="12" fill="#1f2328" font-family="Menlo, monospace" text-anchor="start" xml:space="preserve">h1 = H(data1, prev=0…0)</text>
<text x="52.0" y="184.0" font-size="11" fill="#1a7f37" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, sans-serif" text-anchor="start" xml:space="preserve">✓ 再計算値と一致</text>
<text x="354.0" y="142.0" font-size="15" fill="#1a7f37" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, sans-serif" font-weight="600" text-anchor="start" xml:space="preserve">第 2 項</text>
<text x="354.0" y="166.0" font-size="12" fill="#1f2328" font-family="Menlo, monospace" text-anchor="start" xml:space="preserve">h2 = H(data2, prev=h1)</text>
<text x="354.0" y="184.0" font-size="11" fill="#1a7f37" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, sans-serif" text-anchor="start" xml:space="preserve">✓ 再計算値と一致</text>
<text x="656.0" y="142.0" font-size="15" fill="#1a7f37" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, sans-serif" font-weight="600" text-anchor="start" xml:space="preserve">第 3 項</text>
<text x="656.0" y="166.0" font-size="12" fill="#1f2328" font-family="Menlo, monospace" text-anchor="start" xml:space="preserve">h3 = H(data3, prev=h2)</text>
<text x="656.0" y="184.0" font-size="11" fill="#1a7f37" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, sans-serif" text-anchor="start" xml:space="preserve">✓ 再計算値と一致</text>
<text x="36.0" y="244.0" font-size="15" fill="#cf222e" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, sans-serif" font-weight="600" text-anchor="start" xml:space="preserve">第 2 項の保存データを 1 バイト改ざんした場合</text>
<text x="52.0" y="290.0" font-size="15" fill="#1a7f37" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, sans-serif" font-weight="600" text-anchor="start" xml:space="preserve">第 1 項</text>
<text x="52.0" y="314.0" font-size="12" fill="#1f2328" font-family="Menlo, monospace" text-anchor="start" xml:space="preserve">h = h1（一致）</text>
<text x="52.0" y="332.0" font-size="11" fill="#1a7f37" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, sans-serif" text-anchor="start" xml:space="preserve">✓ 一致</text>
<text x="354.0" y="290.0" font-size="15" fill="#cf222e" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, sans-serif" font-weight="600" text-anchor="start" xml:space="preserve">第 2 項</text>
<text x="354.0" y="314.0" font-size="12" fill="#cf222e" font-family="Menlo, monospace" text-anchor="start" xml:space="preserve">h2' ≠ H(data2', prev=h1)</text>
<text x="354.0" y="332.0" font-size="11" fill="#cf222e" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, sans-serif" text-anchor="start" xml:space="preserve">✗ 不一致を検出</text>
<text x="656.0" y="290.0" font-size="15" fill="#cf222e" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, sans-serif" font-weight="600" text-anchor="start" xml:space="preserve">第 3 項</text>
<text x="656.0" y="314.0" font-size="12" fill="#cf222e" font-family="Menlo, monospace" text-anchor="start" xml:space="preserve">h3' ≠ H(data3, prev=h2)</text>
<text x="656.0" y="332.0" font-size="11" fill="#cf222e" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, sans-serif" text-anchor="start" xml:space="preserve">✗ 不一致を検出</text>
<text x="50.0" y="396.0" font-size="15" fill="#cf222e" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, sans-serif" font-weight="600" text-anchor="start" xml:space="preserve">検証結果（verify コマンドの出力）</text>
<text x="50.0" y="418.0" font-size="12" fill="#1f2328" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, sans-serif" text-anchor="start" xml:space="preserve">状態: broken / 検出位置: 第 2 項（該当する証憑ID）</text>
<text x="50.0" y="436.0" font-size="12" fill="#1f2328" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, sans-serif" text-anchor="start" xml:space="preserve">理由: content-mismatch</text>
<text x="50.0" y="454.0" font-size="12" fill="#1f2328" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, sans-serif" text-anchor="start" xml:space="preserve">期待: 3f9a…（保存時のハッシュ）    実際: 8c21…（再計算したハッシュ）</text>
<text x="36.0" y="512.0" font-size="13" fill="#59636e" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, sans-serif" text-anchor="start" xml:space="preserve">改ざんを検知できるだけでなく、どの証憑のどの位置で壊れたかを特定できる。</text>
<text x="36.0" y="534.0" font-size="13" fill="#59636e" font-family="Hiragino Sans, Hiragino Kaku Gothic Pro, sans-serif" text-anchor="start" xml:space="preserve">S3 Object Lock（WORM）は改ざん自体を拒否し、ハッシュチェーンは万一の破損・内部犯行を事後検知する。</text>
